name: Code Quality

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta, development]

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install docusaurus dependencies (needed by check:jsdoc + prebuild:docs)
        run: cd docusaurus && npm ci --legacy-peer-deps

      - name: Documentation coverage
        run: npm run check:docs

      - name: JSDoc completeness ratchet
        run: npm run check:jsdoc

      - name: Integration parity gate
        run: npm run check:integration-parity

      - name: Integration template-compile gate
        run: npm run check:integration-build

      - name: Auto-doc partials are fresh
        run: |
          cd docusaurus
          npm run prebuild:docs
          cd ..
          if ! git diff --exit-code docs/components/_generated/; then
            echo ""
            echo "ERROR: docs/components/_generated/ is stale. Run:"
            echo "  cd docusaurus && npm run prebuild:docs"
            echo "and commit the diff."
            exit 1
          fi

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint
        continue-on-error: true

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
