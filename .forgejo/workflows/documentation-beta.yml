name: Documentation (Beta)

# Refreshes /beta/styleguide/ on every beta push. Parallel to documentation.yml,
# which deploys the full Docusaurus + Styleguidist site.
#
# CHANGED FROM GH VERSION:
#   - Deploys to a separate "branch alias" on the same CF Pages project
#     so the URL stays predictable: <project>-beta.pages.dev or a CNAME
#     mapping you control. The Pages project should be configured with
#     a "beta" branch alias if you want clean URLs.

on:
  push:
    branches:
      - beta
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-beta:
    name: Deploy Beta Styleguide
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install root + build validators
        run: |
          npm ci --legacy-peer-deps
          npm run build:validators

      - name: Build styleguide
        run: |
          cd styleguide
          npm ci --legacy-peer-deps
          npm run build

      - name: Deploy beta styleguide to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx -y wrangler@latest pages deploy styleguide/build \
            --project-name=${{ secrets.CF_PAGES_PROJECT }}-styleguide-beta \
            --branch=beta \
            --commit-hash=${{ github.sha }} \
            --commit-message="Beta styleguide from Codeberg Actions"
