name: Documentation

# CHANGED FROM GH VERSION:
#   - peaceiris/actions-gh-pages (publishes to gh-pages branch) replaced with
#     a Cloudflare Pages direct-upload deploy via wrangler.
#   - Target site: nextcloud-vue.conduction.nl (matches existing fleet pattern
#     per CLAUDE.md memory: docusaurus-preset fleet "live at {app}.conduction.nl").
#   - Concurrency keep at workflow-level (Forgejo Actions supports it).
#
# REQUIRED CODEBERG SECRETS:
#   - CF_API_TOKEN: Cloudflare API token with Pages edit permission.
#     Generate at https://dash.cloudflare.com/profile/api-tokens
#     using the "Edit Cloudflare Workers" template, scoped to the
#     "Conduction" account.
#   - CF_ACCOUNT_ID: Cloudflare account ID (the conduction.nl account).
#   - CF_PAGES_PROJECT: the CF Pages project name. Suggested:
#     "nextcloud-vue-docs". Create via wrangler or the dashboard once,
#     then this workflow does subsequent deploys.

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Documentation
    runs-on: docker
    container:
      image: node:24-bookworm
    # Only deploy on push, not on pull requests (PR runs just verify the build)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install root + build validators
        run: |
          npm ci --legacy-peer-deps
          npm run build:validators

      - name: Build styleguide
        run: |
          cd styleguide
          npm ci --legacy-peer-deps
          npm run build

      - name: Clear build cache and install docusaurus
        run: |
          cd docusaurus
          rm -rf node_modules/.cache .docusaurus build
          npm run ci

      - name: Verify build output
        run: |
          test -f docusaurus/build/index.html || { echo "ERROR: index.html not found"; exit 1; }

      - name: Copy styleguide into docusaurus build
        run: |
          mkdir -p docusaurus/build/styleguide
          cp -r styleguide/build/. docusaurus/build/styleguide/

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx -y wrangler@latest pages deploy docusaurus/build \
            --project-name=${{ secrets.CF_PAGES_PROJECT }} \
            --branch=${{ github.ref_name }} \
            --commit-hash=${{ github.sha }} \
            --commit-message="Deploy from Codeberg Actions: ${{ github.event.head_commit.message }}"
