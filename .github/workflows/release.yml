name: Release

# Auto-publish @conduction/nextcloud-vue to npm via semantic-release.
#
# Authentication: npm Trusted Publisher (OIDC) — no NPM_TOKEN secret to
# rotate. The runner mints a short-lived ID token via `id-token: write`,
# npm validates the {repo, workflow} claim against its trust config, and
# issues a one-shot publish credential. Provenance attestations are
# signed automatically (NPM_CONFIG_PROVENANCE=true).
#
# Why @semantic-release/exec instead of @semantic-release/npm publishing
# directly: as of v12.x, @semantic-release/npm has no OIDC awareness and
# its `verify-auth` step refuses to run without an NPM_TOKEN. We set
# `npmPublish: false` on that plugin (which only does the in-place
# version bump in package.json) and run the OIDC publish via
# @semantic-release/exec in the same publish lifecycle. The plugin
# invokes `npx -y npm@latest` because Node 24's bundled npm 11.x is
# usually OIDC-capable but the npx form is hardened against version
# regressions.
#
# Trust config on npmjs.com expects this workflow at the path
# `.github/workflows/release.yml` in `ConductionNL/nextcloud-vue`. If
# you rename or move this file, update the npm Trusted Publisher config.
#
# Node 24 is the floor: semantic-release@24 requires Node ^22.14 || ≥24.10
# and the publish path uses npm CLI's OIDC support, which lands in
# npm 11.x (bundled with Node 24).
#
# Pattern mirrored from `ConductionNL/design-system`'s
# `publish-packages.yml` for `@conduction/docusaurus-preset` — the only
# Conduction package currently shipping cleanly via semantic-release +
# OIDC.

# ⚠️ THIS PACKAGE STAYS ON THE 2.x LINE. NOBODY CHOSE A 3.
#
# Commit 0db89dc58, `feat(widgets)!: remove the news widget, LaunchPad owns it
# now`, carries a `BREAKING CHANGE:` footer. commit-analyzer read it and
# published 3.0.0 on 14 September, then 3.1.0, 3.2.0, 3.3.0 and 3.4.0. No
# person decided that. A footer did.
#
# Two changes in `.releaserc.json` stop it happening again, and they are
# layered on purpose.
#
# 1. commit-analyzer now carries `releaseRules: [{breaking: true, release:
#    "minor"}]`. A breaking footer, and a `type!:` header, now compute a minor.
#    Measured against main on 2026-09-19: 93 commits since v2.53.1, including
#    that footer, compute 2.54.0 instead of 3.0.0.
#
# 2. exec's `verifyReleaseCmd` refuses any computed version outside 2.x. It
#    runs before prepare and publish, so the release aborts with
#    EVERIFYRELEASE and nothing reaches npm. Mutation-tested the same day:
#    with rule 1 removed the analyzer computed 3.0.0 and this step stopped it.
#
# Rule 1 keeps the numbers right. Rule 2 is there for the day somebody edits
# rule 1 without meaning to. A rule with no backstop is one careless merge
# from being gone.
#
# TO CUT A DELIBERATE MAJOR, two edits and a review:
#
#   a. Raise the ceiling in `verifyReleaseCmd` from `2.*` to the major you
#      want.
#   b. Drop the `breaking: true` release rule, so a breaking footer bumps the
#      major again.
#
# Both live in `.releaserc.json`. Put them in their own pull request, with the
# consumer re-pin plan in the body. Fourteen apps track this package and a
# major strands every one of them.
#
# Keep this trigger list and `.releaserc.json`'s `branches` in agreement: a
# branch configured in one and not the other is a release channel that
# silently never publishes. That is not hypothetical — it is how
# `2.1.0-vue3.1` ended up shipping only when somebody remembered to dispatch
# it by hand.
#
# ⚠️ THE `vue3` CHANNEL IS GONE, BUT ITS npm DIST-TAG OUTLIVED IT.
#
# This comment used to describe `feat/vue-3` as a live Vue-3 line mapped to a
# `vue3` dist-tag. Both halves are now false: the branch was folded into main
# (see the `chore/fold-vue3-branches*` branches) and `.releaserc.json` lists
# only `main` and `beta`. What survived is the npm dist-tag itself, still
# pointing at **2.3.0** while `latest` moved to 2.8.x.
#
# A stale dist-tag is worse than no dist-tag: it reads as a deliberate
# compatibility floor. Twelve apps sat on 2.3.0 for months and the tag was
# the reason it looked intentional — `npm view` shows 2.3.0 and 2.8.x declare
# IDENTICAL peer dependencies, `vue: ^3.5.0` included, so there was never a
# Vue-3 boundary to hold. See `retag.yml` for the one-shot repair.
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run semantic-release --dry-run only (no publish, no tag, no release)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    # Observed max 2.4 min over n=18 runs; 20 is a loose upper bound.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  release:
    name: Release
    needs: quality
    runs-on: ubuntu-latest
    # Observed median 1.3 min / max 4.0 min over n=73 runs; bounded loosely at 45
    # because a spurious release failure is expensive (frontend build alone has
    # been measured at 211 s under load).
    timeout-minutes: 45
    permissions:
      contents: write       # @semantic-release/git pushes the chore(release) bump back to beta/main
      issues: write
      pull-requests: write
      id-token: write       # npm Trusted Publisher (OIDC) + provenance attestation
    env:
      NPM_CONFIG_PROVENANCE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Track the branch head, not the detached triggering SHA. On an
          # actively-pushed branch the run can start after new commits land;
          # a detached checkout makes semantic-release see local as "behind
          # the remote" and silently skip the publish (green-but-no-publish).
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
