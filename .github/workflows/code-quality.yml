name: Code Quality

on:
  push:
    branches: [main, beta, 'feat/vue-3']
  pull_request:
    # `feat/vue-3` is the long-lived Vue-3 integration branch and MUST be
    # listed here. While it was missing, every PR into it merged with zero
    # checks (e.g. #541, "no checks reported") — which is how the branch ended
    # up with a hard-broken `npm ci`, Vue-2 render functions in shipped source
    # and a test suite that could not run at all.
    branches: [main, beta, development, 'feat/vue-3']

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install docusaurus dependencies (needed by check:jsdoc + prebuild:docs)
        run: cd docusaurus && npm ci

      - name: Documentation coverage
        run: npm run check:docs

      # G2 — Phase 2.5 of the unify-component-docs change.
      # Fails the build if any Cn* component's JSDoc completeness score
      # has regressed below the per-component baseline at
      # scripts/.jsdoc-baselines.json. New components must score 100%.
      - name: JSDoc completeness ratchet
        run: npm run check:jsdoc

      # Pluggable integration registry parity gate (AD-11/AD-13).
      # Fails the build if any integration descriptor shipped in
      # src/integrations/ is missing its `tab` or `widget` component.
      - name: Integration parity gate
        run: npm run check:integration-parity

      # Phase K / K1 — integration-leaf template-compile gate (ADR-019).
      # Fast-feedback companion to the full `npm run build` step below.
      # Compiles every src/integrations/builtin/**.vue <template> through
      # vue-template-compiler + buble (the same path rollup-plugin-vue
      # uses at build time) and fails — attributed to the exact .vue
      # file — when a template uses ES2020 syntax buble rejects (`?.`/`??`).
      # Guards against the rollout's biggest near-miss: a template-side
      # optional-chain in CnContactsCard.vue that passed jest but broke
      # `npm run build`. The build step below remains the authoritative
      # gate; this step just surfaces the failure in seconds with a
      # precise message.
      - name: Integration template-compile gate
        run: npm run check:integration-build

      # G1 — Phase 2.5 of the unify-component-docs change.
      # Fails the build if a SFC change wasn't accompanied by regenerating
      # the auto-doc partial via vue-docgen-cli. Run docusaurus's prebuild
      # hook then verify the generated tree is unchanged.
      - name: Auto-doc partials are fresh
        run: |
          cd docusaurus
          npm run prebuild:docs
          cd ..
          if ! git diff --exit-code docs/components/_generated/; then
            echo ""
            echo "::error::docs/components/_generated/ is stale. Run:"
            echo "::error::  cd docusaurus && npm run prebuild:docs"
            echo "::error::and commit the diff."
            exit 1
          fi

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run stylelint
        continue-on-error: true

      - name: Tests
        run: npm test

      # Phase K / K1 — authoritative template-ES2020 gate. `rollup -c`
      # runs rollup-plugin-vue → vue-template-compiler → buble over every
      # SFC; a template-side `?.`/`??` (or any other buble-incompatible
      # syntax) fails here. The `check:integration-build` step above is the
      # fast, integration-scoped early-warning for the same class of bug.
      - name: Build
        run: npm run build

      # Needs dist/, so it runs after the build. Asserts that every scope id the
      # built JS stamps onto elements has a matching rule in the CSS reachable
      # from css/index.css — the entry consumers import. When that invariant
      # broke, dist-consuming apps rendered whole components unstyled with no
      # error anywhere.
      - name: Published CSS entry ships the scoped styles
        run: npm run check:css-entry
