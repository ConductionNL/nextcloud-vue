name: Code Quality

on:
  push:
    branches: [main, beta, development, 'feat/vue-3', feature/**, bugfix/**, hotfix/**]
  pull_request:
    # `synchronize` is load-bearing, not tidiness. Without it a PR is checked
    # ONLY at the moment it is opened, so every commit pushed afterwards — the
    # review fixes, the conflict resolution, the merge commit — is unchecked, and
    # the PR still shows the green tick earned by its first commit.
    #
    # The `push` trigger above hides this for branches named `feature/**`,
    # `bugfix/**` or `hotfix/**`, and hides it for nothing else. Measured on
    # 2026-08-03: a merge commit pushed to `fix/object-access-grant-type` (#591)
    # produced NO run at all, while `mergeStateStatus` reported CLEAN and the
    # stale success from the first commit was still the visible answer. `fix/**`
    # is one of the most common prefixes in this repo, so the gap is not exotic.
    #
    # Adding branch prefixes to `push` would be the wrong fix — the list can
    # never be complete, and each missing prefix fails silently in the one
    # direction nobody checks. `synchronize` covers every branch name there is.
    types: [opened, reopened, synchronize]
    # `feat/vue-3` is the long-lived Vue-3 integration branch and MUST be
    # listed here. While it was missing, every PR into it merged with zero
    # checks (e.g. #541, "no checks reported") — which is how the branch ended
    # up with a hard-broken `npm ci`, Vue-2 render functions in shipped source
    # and a test suite that could not run at all.
    branches: [main, beta, development, 'feat/vue-3']
  workflow_dispatch:

# ⚠️ THE EVENT NAME IS PART OF THIS KEY, AND DROPPING IT CANCELS RELEASES.
#
# This group used to be `quality-${{ github.head_ref || github.ref_name }}`.
# For a PUSH, `ref_name` is the branch; for a PULL REQUEST, `head_ref` is the
# branch. So a push to `beta` and a PR whose head is `beta` both resolved to
# `quality-beta` — and with `cancel-in-progress`, opening the release PR
# CANCELLED the release branch's own quality run.
#
# Measured 2026-08-27 on the 2.20.0 release: run 33071272493 (push to beta)
# had all 26 of its real jobs `cancelled` the moment `beta -> main` was
# opened. It did not read as cancelled, though. The `Quality Report`
# aggregator `needs:` those jobs, and an aggregator whose dependencies are
# cancelled reports **failure** — so the release PR displayed a red
# `quality / Quality Report` that said nothing whatever about the code, and
# the only way to tell was to open the run and notice every sibling job
# saying `cancelled`.
#
# Red-that-is-never-real is the most expensive kind of gate: it costs a full
# runner matrix to produce and it teaches everyone to stop reading the colour.
#
# Keying on the event preserves the intent — a new push still cancels the
# previous push for that branch, and a new commit on a PR still cancels that
# PR's previous run — while letting the two coexist, which is what every
# `development -> beta` and `beta -> main` release requires.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege for the called quality pipeline: the Quality Report job
# posts a sticky PR comment (issues/pull-requests write); everything else
# only reads the checkout.
# Permission CEILING for the called quality pipeline. GitHub statically
# validates the called workflow's declared job permissions against this
# grant — even for jobs that are disabled — so it must cover the maximum
# any nested job declares: journeydoc-capture (contents+actions write),
# update-baseline / features-extract (contents write), and the Quality
# Report PR comment (issues / pull-requests write). A narrower grant makes
# the whole call fail at STARTUP: zero jobs, no annotations.
permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  quality:
    if: github.event_name != 'push' || github.event.created != true
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: nextcloud-vue
      # JS-only component library: no composer.json, so the whole PHP
      # toolchain (php-quality, PHPUnit, composer security/license, SBOM)
      # is off via the master switch.
      enable-php: false
      enable-frontend: true
      enable-eslint: true
      node-version: "24"
      # docusaurus deps are needed by check:jsdoc and check:docs-fresh
      # (prebuild:docs); the setup command runs in every check leg.
      frontend-setup-command: "cd docusaurus && npm ci"
      # Each entry runs as its own "quality / Frontend Check (<script>)" job.
      # check:build bundles build + check:css-entry (css-entry needs dist/;
      # the packaging spec in `test` builds on demand when dist/ is absent).
      # check:peers is the offline peer-dependency consistency gate — a peer
      # block contradiction (initial-state ^2 vs ^3) once broke every
      # consumer's npm ci while this repo's own install stayed green.
      # check:integration-build is intentionally absent: the Vue-2 buble
      # template gate was removed with the Vue-3 migration (Vue 3's compiler
      # handles `?.`/`??` natively).
      #
      # check:a11y is NOT optional and NOT covered by `test`. `jest.config.js`
      # excludes `tests/a11y/` via `testPathIgnorePatterns` on purpose (the
      # main lane mocks `@nextcloud/vue` down to a bare `<div class="stub">`,
      # which would make every axe-core assertion pass against markup that has
      # no ARIA in it — a textbook false green). The consequence is that
      # `npm test` runs zero a11y specs, so until this entry existed the whole
      # `tests/a11y/` lane — 9 suites, 38 tests, the `wcag-a11y-anchor`
      # deliverable — had never executed in CI even once. Its absence was
      # indistinguishable from its success. Added 2026-08-04 together with the
      # CnPageHeading spec, which exists precisely to keep an accessible <h1>
      # inside <main> and would otherwise have been unenforced.
      #
      # check:smoke is the real-render sweep and, like check:a11y, is NOT
      # covered by `test`. `jest.config.js` excludes `tests/smoke/` because the
      # main lane stubs @nextcloud/vue down to a permissive `<div>` — against
      # that stub the sweep would mount all 233 components and pass every one
      # while validating nothing, the same false green check:a11y guards
      # against. It is the only lane that meets the real @nextcloud/vue 9 API
      # surface across the whole library, which is where a Vue 2 -> 3 leftover
      # ($set, $scopedSlots, _uid, moment-style date formats) actually shows up.
      #
      # check:vue3-compile and check:public-safe are the last two scripts this
      # repository defines that no gate ran. Same class as check:a11y,
      # check:smoke and the Playwright job above, each added with a note saying
      # its absence had been indistinguishable from its success — and the same
      # answer: a check nobody runs is a check that runs when someone remembers.
      #
      # check:vue3-compile sweeps all 366 components through Vue 3's compiler in
      # compat MODE 2. It is the lane that sees a Vue-2 leftover in a TEMPLATE,
      # which `test` cannot: the unit lane mounts components it has a spec for,
      # and the sweep compiles every component there is.
      #
      # check:public-safe asserts that nothing reachable from the `public` entry
      # pulls in `@nextcloud/*`. That entry exists so a non-Nextcloud host can
      # use these components; one stray import makes it unusable, and the
      # failure lands in the CONSUMER's build rather than here.
      #
      # ⚠️ check:dist-sideeffects is deliberately still absent, and that is a
      # gap, not a decision. It needs `dist/`, which each check leg would have to
      # build for itself — and it cannot be verified from a checkout inside the
      # Nextcloud server tree (the documented `@vue/tsconfig` resolution
      # artifact), so wiring it blind would mean shipping a gate nobody has seen
      # pass. It belongs in a job of its own, like the e2e one.
      frontend-checks: >-
        ["test", "check:build", "check:docs", "check:jsdoc",
         "check:integration-parity", "check:peers", "check:docs-fresh",
         "check:a11y", "check:smoke", "check:vue3-compile",
         "check:public-safe"]
      enable-sbom: false
      # The repo ships a REUSE.toml and LICENSES/ and lints clean (REUSE spec
      # 3.3), so findings are regressions and may fail the build.
      reuse-blocking: true

  # ⚠️ THE PLAYWRIGHT SUITE HAD NEVER RUN IN CI. NOT ONCE.
  #
  # `e2e/` holds 100 tests across 20 files, and no gate executed any of them.
  # The shared pipeline above runs the nine `frontend-checks` entries and
  # nothing else; `test:e2e` was not among them, and this repository declared
  # no job of its own. Every one of those tests was a local-only check — which
  # is to say, a check that runs when someone remembers to run it.
  #
  # That is not a cosmetic gap, because of what this lane is FOR. The unit lane
  # runs in jsdom, which computes no layout, so the canvas specs record in
  # their own header that mounting Vue Flow there "yields ZERO node elements"
  # and every geometry assertion "would pass over an empty list". The e2e lane
  # exists precisely to catch what jsdom cannot see — and it was the half
  # nobody was running. `check:a11y` and `check:smoke` were added to the list
  # above for exactly this reason, each with a note saying their absence was
  # indistinguishable from their success. This is the third one.
  #
  # A JOB OF ITS OWN, not a tenth `frontend-checks` entry. Each entry there
  # runs the same `frontend-setup-command` (`cd docusaurus && npm ci`), and
  # Playwright additionally needs a browser and its system libraries —
  # installing those in the shared setup would pay that cost in all nine legs
  # to serve one.
  # ⚠️ `enable-playwright: true` ON THE SHARED WORKFLOW IS DELIBERATELY NOT SET,
  # AND THIS IS NOT AN OVERSIGHT TO TIDY UP.
  #
  # ConductionNL/.github's quality.yml DOES carry an "E2E Tests (Playwright)"
  # job behind that input, which is why it shows on every run here as `skipped`.
  # Flipping it on would be the obvious-looking fix and it would be wrong: that
  # job checks out the Nextcloud SERVER and its submodules, sets up PHP,
  # installs Nextcloud, and mounts the repository as an app. It is built for a
  # Nextcloud app's e2e suite.
  #
  # This repository is a component LIBRARY. It has no `appinfo/info.xml`, so
  # there is no app to install, and its Playwright suite runs against a Vite
  # harness on :5199 with no server, no PHP and no Nextcloud anywhere in it.
  # Enabling the shared job would boot an entire Nextcloud instance to run 101
  # specs that never touch one — and then fail trying to enable an app that
  # does not exist.
  #
  # Hence the dedicated job below: `npm ci`, `playwright install`, run. ~4
  # minutes. The skipped shared leg is the correct outcome, not a missing one.
  e2e:
    name: Playwright (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # The `pretest` step `test:e2e` does not have. `src/utils/
      # validateManifestV2.compiled.js` is generated, and .gitignore'd — so a
      # clean checkout does not have it, and the harness mounts real library
      # SFCs that reach the manifest validator.
      - run: npm run build:validators

      # `--with-deps` installs the browser AND the system libraries a headless
      # Chromium needs. Chromium only: playwright.config.js declares exactly
      # one project, so pulling Firefox and WebKit would be download time spent
      # on browsers no test names.
      - run: npx playwright install --with-deps chromium

      # The config starts the Vite harness itself (`webServer`) and, with CI
      # set, does NOT reuse an existing server.
      - run: npm run test:e2e
        env:
          CI: "true"

      # ⚠️ ALWAYS, AND THIS IS THE POINT OF THE JOB AS MUCH AS THE RUN ITSELF.
      #
      # A failing Playwright test writes an `error-context.md` holding the
      # accessibility tree at the moment it failed, plus a trace on retry. Read
      # from CI those turn "an assertion timed out" into "the element was
      # inside a closed container" — the difference between diagnosing a
      # failure and guessing at it. Without the upload the only thing a red
      # cell says is that it is red.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The third script this repository defines that no gate ran. It could not go
  # into `frontend-checks` with the others: it needs a built `dist/`, and each
  # check leg is its own job with its own checkout, so the build has to happen
  # in the same job. Hence a dedicated one, like the e2e job above.
  #
  # ⚠️ READ WHAT THIS CAN AND CANNOT CATCH BEFORE TRUSTING A GREEN CELL.
  #
  # The bug it was written for is real and severe: `package.json#sideEffects`
  # is an ALLOWLIST, and when it failed to match the compiled `*.vue.js`
  # render-attach wrappers, consumers' webpack shook every one of them away and
  # every Cn component shipped render-less. Vue 3 renders a render-less
  # component as a silent comment node — blank app, zero errors, zero warnings.
  # Observed on hermiq, where it blocked a full e2e suite.
  #
  # ON TODAY'S EMIT SHAPE IT PASSES BY CONSTRUCTION, and I measured that rather
  # than assuming it. Deleting `**/*.vue.js` from the allowlist and re-running
  # still reports OK. The reason is that the build no longer emits what the
  # gate was written against: the barrel now does
  #
  #     export { default as CnAppRoot } from './components/.../CnAppRoot.vue.js'
  #
  # — a VALUE re-export from the wrapper, where it used to export from
  # `.vue2.js` and carry a separate bare `import './X.vue.js'` alongside. There
  # are zero bare `*.vue.js` imports left in `dist/esm/index.js`. A value
  # dependency cannot be tree-shaken, so the render survives whatever the
  # allowlist says.
  #
  # So this is a REGRESSION GUARD for an emit shape that is not currently in
  # use, not a live assertion about the allowlist. It fires if a rollup or
  # plugin upgrade reverts the barrel to bare side-effect imports while the
  # allowlist is wrong — which is exactly how the original bug arrived. That is
  # worth two minutes of CI. It is NOT evidence that the allowlist is correct,
  # and a green cell here must not be read as such.
  dist-sideeffects:
    name: "Dist sideEffects (tree-shaking)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:dist-sideeffects
